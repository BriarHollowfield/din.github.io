<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Перейти в Telegram</title>
  <meta name="description" content="Перейти в Telegram">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { height: 100%; background: var(--bg-bottom); }
    body { height: 100%; }

    :root {
      --bg-top: #0f172a;
      --bg-bottom: #1e293b;
      --text: #e2e8f0;
      --muted: #64748b;
      --link: #94a3b8;
      --link-hover: #e2e8f0;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-top: #f8fafc;
        --bg-bottom: #e2e8f0;
        --text: #1e293b;
        --muted: #64748b;
        --link: #64748b;
        --link-hover: #0f172a;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      width: 100%;
    }

    .tg-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: linear-gradient(180deg, #37aee2 0%, #1e96c8 100%);
      color: #fff;
      text-decoration: none;
      font-size: 22px;
      font-weight: 700;
      padding: 22px 48px;
      border-radius: 60px;
      box-shadow: 0 12px 32px rgba(30, 150, 200, 0.45);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .tg-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 40px rgba(30, 150, 200, 0.6);
    }

    .tg-btn:active { transform: translateY(0); }

    .tg-btn svg { width: 30px; height: 30px; fill: #fff; flex-shrink: 0; }

    @media (max-width: 480px) {
      .tg-btn {
        font-size: 19px;
        padding: 18px 32px;
        gap: 12px;
        max-width: 100%;
      }
      .tg-btn svg { width: 26px; height: 26px; }
      footer { padding: 24px 16px calc(24px + env(safe-area-inset-bottom)); }
      footer a { display: block; margin: 8px 0; }
      footer .sep { display: none; }
    }

    footer {
      padding: 28px 16px 36px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      width: 100%;
    }

    footer a {
      color: var(--link);
      text-decoration: none;
      margin: 0 8px;
      white-space: nowrap;
    }

    footer a:hover { color: var(--link-hover); text-decoration: underline; }

    footer .sep { margin: 0 8px; }
  </style>

  <script>
    function getParam(name) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(name);
    }

    const fbid = getParam("pixel");

    if (fbid) {
        !(function (f, b, e, v, n, t, s) {
            if (f.fbq) return;
            n = f.fbq = function () {
                n.callMethod
                    ? n.callMethod.apply(n, arguments)
                    : n.queue.push(arguments);
            };
            if (!f._fbq) f._fbq = n;
            n.push = n;
            n.loaded = !0;
            n.version = "2.0";
            n.queue = [];
            t = b.createElement(e);
            t.async = !0;
            t.src = v;
            s = b.getElementsByTagName(e)[0];
            s.parentNode.insertBefore(t, s);
        })(
            window,
            document,
            "script",
            "https://connect.facebook.net/en_US/fbevents.js",
        );

        fbq("init", fbid);
        fbq("track", "PageView");
    }
</script>


</head>
<body>
  <main>
    <a class="tg-btn" href="tg://join?invite=2SKV2iA6MK5mZmEy" onclick="fbq('track', 'Lead')">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 12.86 3.64 11.6c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/>
      </svg>
      Перейти в Telegram
    </a>
  </main>

  <footer>
    <a href="privacy.html">Політика конфіденційності</a><span class="sep">·</span><a href="cookies.html">Cookies</a><span class="sep">·</span><a href="terms.html">Умови використання</a>
  </footer>
</body>
</html>
